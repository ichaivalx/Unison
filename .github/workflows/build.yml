name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Install Android tools
        run: sdkmanager 'platforms;android-36' 'ndk;30.0.16248370' 'cmake;4.1.2'
      - name: Build signed APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: unison-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S windows -B out/windows -A x64
      - name: Build
        run: cmake --build out/windows --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: unison-windows
          path: out/windows/Release/unison-receiver.exe
          if-no-files-found: error
