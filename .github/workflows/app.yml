name: App
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: app/pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release --target-platform android-arm64
      - run: mv build/app/outputs/flutter-apk/app-release.apk unison-arm64.apk
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: app/unison-arm64.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: app/pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Unison | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* dist/Unison/
          Compress-Archive -Path dist/Unison -DestinationPath unison-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: app/unison-windows-x64.zip
          if-no-files-found: error
